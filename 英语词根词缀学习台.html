<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语词根词缀学习台</title>
<style>
  :root{
    --bg:#f5f7fb; --card:#fff; --ink:#1f2733; --ink2:#5b6675; --line:#e6ebf2;
    --blue:#2f6bff; --red:#d63031; --soft:#eef3ff;
    --green:#16a34a; --greenbg:#e8f8ef; --amber:#e8a200; --amberbg:#fff5e0;
    --shadow:0 1px 3px rgba(20,40,80,.08),0 6px 18px rgba(20,40,80,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.65;-webkit-text-size-adjust:100%}
  header{background:linear-gradient(135deg,#2f6bff,#5b8bff);color:#fff;padding:18px 20px 14px}
  header h1{margin:0;font-size:21px;letter-spacing:.5px}
  header .sub{opacity:.9;font-size:13px;margin-top:3px}
  .topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:12px}
  .modes{display:flex;gap:6px;background:rgba(255,255,255,.18);padding:4px;border-radius:10px}
  .modes button{border:0;background:transparent;color:#fff;padding:7px 14px;border-radius:7px;font-size:14px;cursor:pointer}
  .modes button.active{background:#fff;color:var(--blue);font-weight:700}
  .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .actions #overall{font-size:13px;background:rgba(255,255,255,.2);padding:5px 10px;border-radius:7px;margin-right:2px}
  .actions button{border:0;background:#fff;color:var(--blue);padding:6px 12px;border-radius:7px;font-size:13px;cursor:pointer}
  .actions button.danger{background:rgba(255,255,255,.25);color:#fff}

  main{max-width:1080px;margin:0 auto;padding:16px 14px 60px}
  section[hidden]{display:none}

  /* ===== 首页 ===== */
  .hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
  .hero .stat-box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);text-align:center}
  .hero .n{font-size:30px;font-weight:800;color:var(--blue)}
  .hero .n.g{color:var(--green)} .hero .n.a{color:var(--amber)} .hero .n.r{color:var(--red)}
  .hero .l{font-size:13px;color:var(--ink2);margin-top:4px}
  .hero-bar{height:10px;background:#eef1f6;border-radius:6px;overflow:hidden;margin:0 0 18px}
  .hero-bar i{display:block;height:100%;background:linear-gradient(90deg,#2f6bff,#16a34a);transition:width .3s}
  .cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .cat-card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
  .cat-head{padding:12px 14px;background:linear-gradient(90deg,#eef3ff,#f7faff);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
  .cat-name{font-weight:700;color:var(--blue);font-size:15px}
  .cat-meta{font-size:12px;color:var(--ink2)}
  .cat-body{padding:12px;display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start}
  .affix-chip{border:1px solid #dde6fb;background:var(--soft);color:var(--blue);border-radius:20px;padding:5px 12px;font-size:13px;cursor:pointer;transition:all .15s;font-family:inherit}
  .affix-chip:hover{background:var(--blue);color:#fff;border-color:var(--blue)}
  .affix-chip b{font-weight:700}
  .home-tip{font-size:12px;color:var(--ink2);margin:6px 2px 14px}

  /* ===== 学习工具栏 ===== */
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px;position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
  .cls-tabs{display:flex;gap:5px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:3px}
  .cls-tabs button{border:0;background:transparent;padding:6px 14px;border-radius:7px;cursor:pointer;font-size:14px;color:var(--ink2)}
  .cls-tabs button.active{background:var(--blue);color:#fff;font-weight:700}
  .toolbar input[type=text]{flex:1;min-width:160px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px}
  .toolbar select{padding:8px 8px;border:1px solid var(--line);border-radius:9px;font-size:13px;background:#fff;color:var(--ink)}
  .scount{font-size:12px;color:var(--ink2);margin:2px 2px 10px}
  .noresult{text-align:center;color:var(--ink2);padding:40px;background:#fff;border:1px dashed var(--line);border-radius:12px}

  /* 语义分组 */
  .sem-group{margin-bottom:14px}
  .sem-head{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(90deg,#eef3ff,#f7faff);border:1px solid var(--line);border-radius:12px;cursor:pointer;text-align:left;font-family:inherit}
  .sem-head .sh-name b{font-size:15px;color:var(--blue)}
  .sem-head .sh-name i{font-style:normal;font-size:12px;color:var(--ink2);margin-left:6px}
  .sem-head .sh-meta{font-size:12px;color:var(--ink2)}
  .sem-head .chev{display:inline-block;transition:transform .2s;color:var(--ink2)}
  .sem-group:not(.collapsed) .chev{transform:rotate(90deg)}
  .sem-body{margin-top:10px}
  .sem-group.collapsed .sem-body{display:none}

  /* 卡片 */
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden}
  .card.done{background:var(--greenbg);border-color:#bfe9d3}
  .chead{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 15px;cursor:pointer;text-align:left;border:0;background:transparent;font-family:inherit}
  .ctitle{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;min-width:0}
  .ctitle b{font-size:18px;color:var(--red)}
  .ctitle i{font-style:normal;color:var(--ink2);font-size:13px}
  .badges{display:flex;flex-wrap:wrap;gap:5px;margin-left:6px}
  .badge{font-size:11px;padding:1px 8px;border-radius:20px;background:var(--soft);color:var(--blue);border:1px solid #dde6fb}
  .badge.lv1{background:#eafaf0;color:#1aa260;border-color:#bfe9d3}
  .badge.lv2{background:#eef3ff;color:#2f6bff;border-color:#d3e0ff}
  .badge.lv3{background:#fdeef2;color:#d6336c;border-color:#f6d2dd}
  .badge.src{background:#f1f3f6;color:#5b6675;border-color:#e0e5ec}
  .cmeta{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .cnt{font-size:12px;color:var(--ink2)}
  .prog{font-size:12px;color:var(--ink2)}
  .prog.all{color:var(--green);font-weight:700}
  .chev{transition:transform .2s;color:var(--ink2);font-size:13px}
  .card.open .chev{transform:rotate(90deg)}
  .cbody{display:none;padding:4px 15px 16px;border-top:1px solid var(--line)}
  .card.open .cbody{display:block;max-height:62vh;overflow:auto}
  .words{margin-top:8px}
  .wline{display:flex;align-items:baseline;gap:10px;padding:6px 8px;border-radius:8px;cursor:pointer;flex-wrap:wrap;transition:background-color .15s}
  .wline:hover{filter:brightness(.97)}
  .wgrp{font-size:12px;font-weight:700;color:var(--blue);margin:10px 2px 4px;padding:3px 0 3px 8px;border-left:3px solid var(--blue);background:linear-gradient(90deg,#eef3ff,#f7faff)}
  .wtext{font-size:15.5px;font-weight:600;min-width:110px}
  .wtext .hl{color:var(--red);font-weight:700}
  .wphon{font-size:12.5px;color:#6b7686;font-style:italic;font-family:"Times New Roman",Georgia,serif;white-space:nowrap}
  .wzh{font-size:12.5px;color:#9a6400;background:#fff3d6;border:1px solid #ffd9a0;border-radius:5px;padding:0 5px;white-space:nowrap}
  .wmean{font-size:13px;color:#3d4852;flex:1;min-width:80px}
  .wcnt{font-size:11px;color:#9aa4b2;white-space:nowrap}
  .cfoot{margin-top:12px;padding-top:11px;border-top:1px dashed var(--line);font-size:13px}
  .cfoot .sum{color:var(--ink)}
  .cfoot .stat{margin-top:6px;color:var(--blue);font-weight:600}
  .cfoot .insight{margin-top:8px;background:#f8faff;border:1px solid #e3ecff;border-radius:9px;padding:9px 11px;color:#33415c;line-height:1.7;white-space:pre-line}
  .cfoot .tip{margin-top:8px;background:#fffaf0;border:1px solid #ffe6b0;border-radius:9px;padding:9px 11px;color:#7a5b00;line-height:1.7}
  .cfoot .src{margin-top:6px;color:#8a93a3;font-size:12px}

  /* 训练 */
  .train-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0}
  .train-meta{font-size:13px;color:var(--ink2);align-self:flex-end}
  .flashcard{width:100%;max-width:560px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:30px 26px;min-height:230px;display:flex;flex-direction:column;justify-content:center;text-align:center}
  .flashcard .fhead{display:flex;justify-content:center;gap:8px;margin-bottom:14px}
  .flashcard .fform{font-size:34px;font-weight:800;color:var(--red);letter-spacing:1px}
  .flashcard .fprompt{color:var(--ink2);font-size:14px;margin-top:10px}
  .flashcard .fdetail{text-align:left;margin-top:8px}
  .flashcard .fmeaning{font-size:20px;font-weight:700;color:var(--ink);text-align:center;margin-bottom:6px}
  .flashcard .fex{font-size:14px;color:var(--ink2);margin:10px 0;line-height:1.9}
  .flashcard .fex .hl{color:var(--red);font-weight:700}
  .flashcard .ftip{font-size:13px;color:#7a5b00;background:#fffaf0;border:1px solid #ffe6b0;border-radius:9px;padding:9px 11px;margin-top:6px}
  .flashcard .fsrc{font-size:12px;color:#8a93a3;margin-top:8px;text-align:center}
  .train-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .train-btns button{padding:11px 22px;border:0;border-radius:11px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
  .b-forget{background:#ffe9ec;color:#d6336c}
  .b-vague{background:#fff3d6;color:#b07400}
  .b-know{background:#e3f9ec;color:#1aa260}
  .b-flip{background:var(--blue);color:#fff}
  .b-restart{background:#fff;border:1px solid var(--line);color:var(--blue)}
  .train-empty{text-align:center;color:var(--ink2);padding:50px 20px;background:#fff;border:1px dashed var(--line);border-radius:14px;max-width:560px}

  /* 进度 */
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
  .stat-box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);text-align:center}
  .stat-box .n{font-size:30px;font-weight:800;color:var(--blue)}
  .stat-box .n.g{color:var(--green)} .stat-box .n.a{color:var(--amber)} .stat-box .n.r{color:var(--red)}
  .stat-box .l{font-size:13px;color:var(--ink2);margin-top:4px}
  .panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:16px}
  .panel h3{margin:0 0 12px;font-size:16px;color:var(--ink)}
  .weak-list{display:flex;flex-direction:column;gap:8px}
  .weak-item{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--line);border-radius:9px}
  .weak-item b{color:var(--red);font-size:14px}
  .weak-item .wmeta{font-size:12px;color:var(--ink2)}
  .progress-bar{height:8px;background:#eef1f6;border-radius:6px;overflow:hidden;margin-top:6px}
  .progress-bar i{display:block;height:100%;background:var(--blue)}

  /* 明细弹窗 */
  .detail-mask{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
  .detail-mask.show{display:flex}
  .detail{background:#fff;border-radius:16px;max-width:640px;width:100%;padding:22px;position:relative;box-shadow:var(--shadow)}
  .detail-close{position:absolute;top:12px;right:12px;border:0;background:#f1f3f6;color:var(--ink2);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:15px}
  .detail-head .dform{font-size:26px;font-weight:800;color:var(--red)}
  .detail-head .dmean{font-size:14px;color:var(--ink2);margin:4px 0 8px}
  .detail-head .badges{margin-bottom:6px}
  .detail-prog{display:flex;align-items:center;gap:10px;margin:10px 0 4px;font-size:13px;color:var(--ink2)}
  .detail-prog .progress-bar{flex:1;margin-top:0}
  .detail-sec{margin:12px 0 6px;font-size:13px;color:var(--ink);font-weight:600}
  .detail .wline{margin-bottom:2px}

  @media (max-width:640px){
    header h1{font-size:18px}
    .topbar{flex-direction:column;align-items:stretch}
    .actions{justify-content:space-between}
    .wtext{min-width:90px;font-size:14px}
    .flashcard .fform{font-size:28px}
    .train-btns button{flex:1;min-width:90px}
    .cat-grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<header>
  <h1>英语词根词缀学习台</h1>
  <div class="sub">词根 · 前缀 · 后缀 一体化：首页概览 + 分类学习 + 训练记忆 + 进度管理</div>
  <div class="topbar">
    <div class="modes">
      <button data-mode="home" class="active">首页</button>
      <button data-mode="learn">学习</button>
      <button data-mode="train">训练</button>
      <button data-mode="progress">进度</button>
    </div>
    <div class="actions">
      <span id="overall">已掌握 0 / 0</span>
      <button id="btnExport">导出备份</button>
      <button id="btnImport">导入恢复</button>
      <button id="btnReset" class="danger">重置进度</button>
      <input type="file" id="fileImport" accept="application/json" hidden>
    </div>
  </div>
</header>

<main>
  <!-- 首页 -->
  <section id="mode-home">
    <div class="hero">
      <div class="stat-box"><div class="n" id="hAffix">0</div><div class="l">词根词缀总数</div></div>
      <div class="stat-box"><div class="n r" id="hWords">0</div><div class="l">典型例词总数</div></div>
      <div class="stat-box"><div class="n g" id="hMaster">0</div><div class="l">已掌握例词</div></div>
      <div class="stat-box"><div class="n a" id="hCat">0</div><div class="l">语义分类数</div></div>
    </div>
    <div class="hero-bar"><i id="hBar" style="width:0%"></i></div>
    <div class="home-tip">📊 总体概览：下方按「语义类别」分组展示全部词根词缀，点击任意词缀查看明细（含义、变体、例词、记忆提示与 AI 洞察）。每个例词均标注 <b>音标</b> 与 <b>汉字谐音</b>（谐音为规则生成的近似助记，仅供跟读参考）。</div>
    <div class="cat-grid" id="catGrid"></div>
  </section>

  <!-- 学习 -->
  <section id="mode-learn" hidden>
    <div class="toolbar">
      <div class="cls-tabs">
        <button data-cls="prefix" class="active">前缀</button>
        <button data-cls="root">词根</button>
        <button data-cls="suffix">后缀</button>
      </div>
      <input type="text" id="q" placeholder="搜索 词缀 / 单词 / 含义（跨前缀·词根·后缀）">
      <select id="fSem"><option value="">全部语义</option></select>
      <select id="fLv">
        <option value="">全部难度</option>
        <option value="1">初中基础</option>
        <option value="2">四级</option>
        <option value="3">六级/考研</option>
      </select>
    </div>
    <div class="scount" id="scount"></div>
    <div id="list"></div>
    <div class="noresult" id="noresult" hidden>没有匹配的词根词缀，换个关键词试试。</div>
  </section>

  <!-- 训练 -->
  <section id="mode-train" hidden>
    <div class="train-wrap">
      <div class="train-meta" id="trainMeta"></div>
      <div id="trainArea"></div>
    </div>
  </section>

  <!-- 进度 -->
  <section id="mode-progress" hidden>
    <div class="stat-grid" id="statGrid"></div>
    <div class="panel">
      <h3>易忘词条</h3>
      <div class="weak-list" id="weakList"></div>
    </div>
    <div class="panel">
      <h3>数据管理</h3>
      <p style="font-size:13px;color:var(--ink2);margin:0 0 10px">学习次数、掌握状态、训练进度均保存在本机浏览器（localStorage）。可导出备份文件，或在其他设备导入恢复。</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button id="btnExport2" style="border:1px solid var(--line);background:#fff;color:var(--blue);padding:8px 16px;border-radius:9px;cursor:pointer">导出备份 JSON</button>
        <button id="btnImport2" style="border:1px solid var(--line);background:#fff;color:var(--blue);padding:8px 16px;border-radius:9px;cursor:pointer">导入恢复</button>
        <button id="btnReset2" style="border:1px solid #f3c0c8;background:#fff;color:var(--red);padding:8px 16px;border-radius:9px;cursor:pointer">清空全部进度</button>
      </div>
    </div>
  </section>
</main>

<!-- 明细弹窗 -->

<script>

const MASTERED = 10;
const STEPS = [0,1,3,7,16,30];
const KEY = 'affix_learn_v1';

/* ---------- 状态 / 持久化 ---------- */
let state = load();
function load(){
  try{ const r = JSON.parse(localStorage.getItem(KEY)); if(r && r.clicks) return r; }catch(e){}
  return { clicks:{}, srs:{}, version:1 };
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function clicksOf(w){ return (state.clicks[w]||0); }
function mastered(w){ return clicksOf(w) >= MASTERED; }

/* 点击加深：返回整行背景色 + 文字色（0次透明，1~9 蓝→绿渐变，≥10 醒目绿） */
function stepColor(c){
  if(c <= 0) return {bg:'transparent', fg:''};
  if(c >= MASTERED) return {bg:'#16a34a', fg:'#ffffff'};
  const t = c/(MASTERED-1);
  const r = Math.round(223 + t*(134-223));
  const g = Math.round(234 + t*(217-234));
  const b = Math.round(255 + t*(168-255));
  return {bg:'rgb('+r+','+g+','+b+')', fg:''};
}
function applyWordState(line, word){
  const c = clicksOf(word);
  const col = stepColor(c);
  line.style.backgroundColor = col.bg;
  line.style.color = col.fg;
  const wt = line.querySelector('.wtext'); if(wt) wt.style.color = col.fg;
  const hl = line.querySelector('.wtext .hl'); if(hl) hl.style.color = (c>=MASTERED ? '#ffffff' : '');
  const mean = line.querySelector('.wmean'); if(mean) mean.style.color = (c>=MASTERED ? 'rgba(255,255,255,.92)' : '');
  const phon = line.querySelector('.wphon'); if(phon) phon.style.color = (c>=MASTERED ? 'rgba(255,255,255,.85)' : '');
  const zh = line.querySelector('.wzh'); if(zh) zh.style.color = ''; /* 谐音标签自带浅底，始终保持 CSS 深色文字 */
  const cnt = line.querySelector('.wcnt'); if(cnt) cnt.style.color = (c>=MASTERED ? 'rgba(255,255,255,.85)' : '');
  line.classList.toggle('mastered', c>=MASTERED);
}

/* ---------- 工具 ---------- */
function esc(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function markWord(wd){
  const hit = wd.hit || '';
  if(!hit) return esc(wd.w);
  const w = wd.w; const i = w.toLowerCase().indexOf(hit.toLowerCase());
  if(i < 0) return esc(w);
  return esc(w.slice(0,i)) + '<b class="hl">'+esc(w.slice(i,i+hit.length))+'</b>' + esc(w.slice(i+hit.length));
}
/* 单词行内容：词(高亮) + 音标 + 汉字谐音 + 释义 + 次数 */
function wordLineHTML(wd){
  const phon = wd.phon ? '<span class="wphon">/' + esc(wd.phon) + '</span>' : '';
  const zh = wd.zh ? '<span class="wzh" title="汉字谐音（近似助记）">'+esc(wd.zh)+'</span>' : '';
  return '<span class="wtext">'+markWord(wd)+'</span>'+phon+zh+'<span class="wmean">'+esc(wd.mean||'')+'</span><span class="wcnt"></span>';
}
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(dstr,n){ const d=new Date(dstr+'T00:00:00'); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const LV_LABEL = {1:'初中基础',2:'四级',3:'六级/考研'};
const CLS_LABEL = {prefix:'前缀',root:'词根',suffix:'后缀'};

/* ---------- 整体统计（按唯一单词计，避免跨词缀重复计数） ---------- */
function uniqueWords(){
  const s=new Set();
  ['prefix','root','suffix'].forEach(c=>APPDATA[c].forEach(it=>it.words.forEach(w=>s.add(w.w))));
  return s;
}
function allWords(){ return uniqueWords().size; }
function masteredCount(){ let n=0; uniqueWords().forEach(w=>{ if(mastered(w)) n++; }); return n; }
function updateOverall(){
  const total=allWords();
  document.getElementById('overall').textContent = '已掌握 '+masteredCount()+' / '+total;
}

/* ---------- 首页 ---------- */
function renderHome(){
  const affix = APPDATA.prefix.length + APPDATA.root.length + APPDATA.suffix.length;
  const words = allWords();
  const m = masteredCount();
  const cats = new Set(); ['prefix','root','suffix'].forEach(c=>APPDATA[c].forEach(it=>{ if(it.sem) cats.add(c+'|'+it.sem); }));
  document.getElementById('hAffix').textContent = affix;
  document.getElementById('hWords').textContent = words;
  document.getElementById('hMaster').textContent = m;
  document.getElementById('hCat').textContent = cats.size;
  document.getElementById('hBar').style.width = (words? (m/words*100):0).toFixed(1) + '%';

  const grid = document.getElementById('catGrid'); grid.innerHTML='';
  ['prefix','root','suffix'].forEach(cls=>{
    const map = new Map();
    APPDATA[cls].forEach((it,idx)=>{ const k=it.sem||'(其他)'; if(!map.has(k)) map.set(k,[]); map.get(k).push({it,idx}); });
    map.forEach((items,k)=>{
      const card = document.createElement('div'); card.className='cat-card';
      card.innerHTML = '<div class="cat-head"><span class="cat-name">'+esc(k)+'</span><span class="cat-meta">'+CLS_LABEL[cls]+' · '+items.length+' 项</span></div>';

      items.forEach(({it,idx})=>{

        chip.onclick = ()=>openDetail(cls, idx);
        body.appendChild(chip);
      });
      card.appendChild(body); grid.appendChild(card);
    });
  });
}

/* ---------- 明细弹窗 ---------- */

function closeDetail(){

/* ---------- 学习模式（按语义分组） ---------- */
let currentCls='prefix', query='', fSem='', fLv='';
function matchLearn(it){
  if(fLv && String(it.lv)!==fLv) return false;
  if(fSem && it.sem!==fSem) return false;
  if(query){
    const q=query.toLowerCase();
    const hay = (it.form+' '+(it.v||'')+' '+(it.m||'')+' '+it.sem+' '+CLS_LABEL[it.__cls]+' '+it.words.map(w=>w.w+' '+w.mean).join(' ')).toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}
function renderLearn(){
  const wrap=document.getElementById('list'); wrap.innerHTML='';
  const cross = !!query; // 有搜索词时跨前缀/词根/后缀全局匹配
  const classes = cross ? ['prefix','root','suffix'] : [currentCls];
  let matched=0;
  classes.forEach(cls=>{
    const items = APPDATA[cls].map((it,idx)=>({it,idx})).filter(({it})=>{ it.__cls=cls; return matchLearn(it); });
    if(!items.length) return;
    // 按语义分组
    const map = new Map();
    items.forEach(({it,idx})=>{ const k=it.sem||'(其他)'; if(!map.has(k)) map.set(k,[]); map.get(k).push({it,idx}); });
    map.forEach((bucket,k)=>{
      matched += bucket.length;
      const sec = document.createElement('div'); sec.className='sem-group';
      const cnt = bucket.reduce((a,{it})=>a+it.words.length,0);
      const head = document.createElement('button'); head.className='sem-head';
      head.innerHTML = '<span class="sh-name"><b>'+esc(k)+'</b> <i>'+CLS_LABEL[cls]+'</i></span>'+
        '<span class="sh-meta">'+bucket.length+' 个词缀 · '+cnt+' 个例词 <span class="chev">▸</span></span>';
      head.onclick = ()=>sec.classList.toggle('collapsed');
      const body = document.createElement('div'); body.className='sem-body';
      bucket.forEach(({it,idx})=>buildCard(body, cls, it, idx, cross));
      sec.appendChild(head); sec.appendChild(body); wrap.appendChild(sec);
    });
  });
  document.getElementById('noresult').hidden = matched!==0;
  document.getElementById('scount').textContent =
    (query||fSem||fLv)
      ? ('匹配 '+matched+' 组'+(cross?'（跨前缀·词根·后缀）':''))
      : ('共 '+APPDATA[currentCls].length+' 组'+CLS_LABEL[currentCls]+'词根词缀');
  updateOverall();
}
function buildCard(wrap, cls, it, idx, cross){
  const card=document.createElement('div'); card.className='card'; card.dataset.idx=idx;
  const head=document.createElement('button'); head.className='chead';
  const badges =
    (cross ? '<span class="badge" style="background:#eef3ff;color:#2f6bff">'+CLS_LABEL[cls]+'</span>' : '')+
    '<span class="badge lv'+it.lv+'">'+LV_LABEL[it.lv]+'</span>'+
    (it.sem ? '<span class="badge">'+esc(it.sem)+'</span>' : '')+
    (it.src ? '<span class="badge src">'+esc(it.src)+'</span>' : '');
  head.innerHTML =
    '<span class="ctitle"><b>'+esc(it.form)+'</b> <i>'+(it.v?('（变体 '+esc(it.v)+'）'):'')+' '+esc(it.m)+'</i>'+
    '<span class="badges">'+badges+'</span></span>'+
    '<span class="cmeta"><span class="cnt">'+it.words.length+' 词</span><span class="prog" data-prog="'+idx+'"></span><span class="chev">▸</span></span>';
  const body=document.createElement('div'); body.className='cbody';
  const wl=document.createElement('div'); wl.className='words';
  it.words.forEach(wd=>{
    if(wd.grp){ const g=document.createElement('div'); g.className='wgrp'; g.textContent=wd.grp; wl.appendChild(g); }
    const line=document.createElement('div'); line.className='wline'; line.dataset.word=wd.w;
    line.innerHTML=wordLineHTML(wd);
    const c=clicksOf(wd.w);
    if(c) line.querySelector('.wcnt').textContent='点击 '+c+' 次'+(c>=MASTERED?' ✓已掌握':'');
    applyWordState(line, wd.w);
    line.onclick=()=>onWord(line, wd.w, cls, idx);
    wl.appendChild(line);
  });
  body.appendChild(wl);
  const foot=document.createElement('div'); foot.className='cfoot';
  foot.innerHTML='<div class="sum"><b>总结：</b>'+esc(it.summary)+'</div>'+
    '<div class="stat">总计 '+it.words.length+' 个词</div>'+
    '<div class="insight"><b>💡 AI 洞察</b><br>'+esc(it.insight)+'</div>'+
    (it.tip?'<div class="tip"><b>📌 记忆提示</b><br>'+esc(it.tip)+'</div>':'')+
    (it.src?'<div class="src">词源：'+esc(it.src)+'</div>':'');
  body.appendChild(foot);
  head.onclick=()=>card.classList.toggle('open');
  card.appendChild(head); card.appendChild(body); wrap.appendChild(card);
  updateCardProgress(card, cls, it, idx); applyCardDone(card, it);
}
function updateCardProgress(card, cls, it, idx){
  const d=it.words.filter(w=>mastered(w.w)).length;
  const prog=card.querySelector('.prog');
  prog.textContent='已掌握 '+d+'/'+it.words.length;
  prog.classList.toggle('all', d===it.words.length);
}
function applyCardDone(card, it){
  const all=it.words.length>0 && it.words.every(w=>mastered(w.w));
  card.classList.toggle('done', all);
}
function onWord(line, word, cls, idx){
  const c=Math.min(clicksOf(word)+1, MASTERED+3);
  state.clicks[word]=c; save();
  applyWordState(line, word);
  line.querySelector('.wcnt').textContent='点击 '+c+' 次'+(c>=MASTERED?' ✓已掌握':'');
  const it=APPDATA[cls][idx];
  updateCardProgress(line.closest('.card'), cls, it, idx); applyCardDone(line.closest('.card'), it);
  updateOverall();
}
function learnThisAffix(cls, idx){
  switchMode('learn');
  currentCls=cls; fSem=APPDATA[cls][idx].sem||''; fLv=''; query='';
  document.getElementById('q').value='';
  document.getElementById('fSem').value=fSem;
  document.getElementById('fLv').value='';
  document.querySelectorAll('.cls-tabs button').forEach(x=>x.classList.toggle('active', x.dataset.cls===cls));
  renderLearn();
  const card=document.querySelector('.card[data-idx="'+idx+'"]');
  if(card){ card.classList.add('open'); card.scrollIntoView({behavior:'smooth',block:'center'}); }
}

/* ---------- 训练模式（SRS） ---------- */
function dueItems(){
  const t=today(); const out=[];
  ['prefix','root','suffix'].forEach(cls=>APPDATA[cls].forEach(it=>{
    const sp=state.srs[it.id];
    const due = sp ? sp.due : '2000-01-01';
    if(due <= t) out.push({cls, it, step: sp?sp.step:0});
  }));
  out.sort((a,b)=>a.step-b.step);
  return out;
}
let trainQueue=[], trainIdx=0, flipped=false, trainCls='', trainItem=null;
function startTrain(useAll){
  trainQueue = useAll ? (()=>{ const o=[]; ['prefix','root','suffix'].forEach(cls=>APPDATA[cls].forEach(it=>o.push({cls,it,step:state.srs[it.id]?state.srs[it.id].step:0}))); return o; })() : dueItems();
  trainIdx=0; renderTrain();
}
function renderTrain(){
  const area=document.getElementById('trainArea'); const meta=document.getElementById('trainMeta');
  if(trainIdx>=trainQueue.length){
    area.innerHTML='<div class="train-empty"><div style="font-size:18px;font-weight:700;color:var(--green);margin-bottom:8px">本轮复习完成 🎉</div>'+
      '<div>没有到期需要复习的词条了。可点下方按钮再来一轮（复习全部）。</div></div>';
    meta.textContent='剩余 0';
    const wrap=document.createElement('div'); wrap.className='train-btns'; wrap.style.marginTop='14px';
    const b=document.createElement('button'); b.className='b-restart'; b.textContent='再来一轮（复习全部）';
    b.onclick=()=>startTrain(true); wrap.appendChild(b); area.appendChild(wrap);
    return;
  }
  const cur=trainQueue[trainIdx]; trainCls=cur.cls; trainItem=cur.it; flipped=false;
  meta.textContent='剩余 '+(trainQueue.length-trainIdx)+' / 共 '+trainQueue.length;
  const card=document.createElement('div'); card.className='flashcard';
  const head='<div class="fhead"><span class="fform">'+esc(cur.it.form)+'</span>'+
    '<span class="badge lv'+cur.it.lv+'">'+LV_LABEL[cur.it.lv]+'</span>'+
    (cur.it.sem?'<span class="badge">'+esc(cur.it.sem)+'</span>':'')+'</div>';
  card.innerHTML=head+'<div class="fprompt">点击翻看释义与例词</div>';
  area.innerHTML=''; area.appendChild(card);
  const btns=document.createElement('div'); btns.className='train-btns'; btns.style.marginTop='14px';
  const flip=document.createElement('button'); flip.className='b-flip'; flip.textContent='翻 看';
  flip.onclick=()=>{ if(!flipped){ flipCard(card, cur.it); flipped=true;
    const g=document.createElement('div'); g.className='train-btns'; g.style.marginTop='14px';
    g.appendChild(gradeBtn('忘了','b-forget',0));
    g.appendChild(gradeBtn('模糊','b-vague',1));
    g.appendChild(gradeBtn('会了','b-know',2));
    card.appendChild(g);
  } };
  btns.appendChild(flip); area.appendChild(btns);
}
function flipCard(card, it){
  const exs=it.words.slice(0,8).map(w=>(markWord(w)+' <span style="color:#6b7686;font-style:italic">/'+esc(w.phon||'')+'/</span> <span style="color:#5b6675">'+esc(w.mean||'')+'</span>')).join('； ');
  const detail='<div class="fdetail"><div class="fmeaning">'+esc(it.m)+(it.v?('（变体 '+esc(it.v)+'）'):'')+'</div>'+
    '<div class="fex">'+exs+'</div>'+
    (it.tip?'<div class="ftip">📌 '+esc(it.tip)+'</div>':'')+
    (it.src?'<div class="fsrc">词源：'+esc(it.src)+'</div>':'')+'</div>';
  card.innerHTML=card.innerHTML.replace('<div class="fprompt">点击翻看释义与例词</div>', detail);
}
function gradeBtn(label, cls, grade){
  const b=document.createElement('button'); b.className=cls; b.textContent=label;
  b.onclick=()=>{ gradeItem(trainItem, grade); trainIdx++; renderTrain(); };
  return b;
}
function gradeItem(it, grade){
  const sp=state.srs[it.id]||{step:0};
  let step=sp.step||0;
  if(grade===2) step=Math.min(step+2, STEPS.length-1);
  else if(grade===1) step=Math.max(step-0,0);
  else step=0;
  const t=today();
  state.srs[it.id]={step, due: step===0? t : addDays(t, STEPS[step]), last:t};
  save();
}

/* ---------- 进度模式 ---------- */
function renderProgress(){
  const total=allWords();
  let mLearn=0, learnIng=0, learnNew=0;
  uniqueWords().forEach(w=>{
    const c2=clicksOf(w); if(c2>=MASTERED) mLearn++; else if(c2>0) learnIng++; else learnNew++;
  });
  let sNew=0,sIng=0,sMas=0;
  ['prefix','root','suffix'].forEach(c=>APPDATA[c].forEach(it=>{
    const sp=state.srs[it.id]; const st=sp?sp.step:0;
    if(st>=STEPS.length-1) sMas++; else if(st>0) sIng++; else sNew++;
  }));
  const grid=document.getElementById('statGrid');
  grid.innerHTML=
    box(mLearn,'已掌握(点击)','g')+box(learnIng,'学习中(点击)','a')+box(learnNew,'未学(点击)','')+
    box(sMas,'已掌握(训练)','g')+box(sIng,'训练中(训练)','a')+box(sNew,'新学(训练)','');
  const weak=[];
  ['prefix','root','suffix'].forEach(c=>APPDATA[c].forEach(it=>{
    const sp=state.srs[it.id]; const st=sp?sp.step:0;
    const struggling=it.words.filter(w=>{const c2=clicksOf(w); return c2>2 && c2<MASTERED;}).length;
    if(st===0 || struggling>0){
      weak.push({form:it.form, lv:it.lv, sem:it.sem, reason: st===0? '训练评级：忘了' : ('点击 '+struggling+' 个词未掌握'), rate: struggling/it.words.length});
    }
  }));
  weak.sort((a,b)=>b.rate-a.rate);
  const wl=document.getElementById('weakList');
  if(!weak.length){ wl.innerHTML='<div style="color:var(--ink2);font-size:13px">暂无易忘词条，继续保持！</div>'; }
  else{
    wl.innerHTML=weak.slice(0,30).map(x=>'<div class="weak-item"><b>'+esc(x.form)+'</b>'+
      '<span class="badge lv'+x.lv+'">'+LV_LABEL[x.lv]+'</span>'+
      (x.sem?'<span class="badge">'+esc(x.sem)+'</span>':'')+
      '<span class="wmeta">'+esc(x.reason)+'</span></div>').join('');
  }
}
function box(n,label,cls){ return '<div class="stat-box"><div class="n '+(cls||'')+'">'+n+'</div><div class="l">'+label+'</div></div>'; }

/* ---------- 模式切换 ---------- */
function switchMode(mode){
  ['home','learn','train','progress'].forEach(m=>document.getElementById('mode-'+m).hidden = (m!==mode));
  document.querySelectorAll('.modes button').forEach(b=>b.classList.toggle('active', b.dataset.mode===mode));
  if(mode==='train') startTrain(false);
  if(mode==='progress') renderProgress();
  if(mode==='home') renderHome();
  if(mode==='learn') renderLearn();
}

/* ---------- 导出 / 导入 / 重置 ---------- */
function doExport(){
  const data={version:1, exportedAt:new Date().toISOString(), clicks:state.clicks, srs:state.srs};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='affix-backup-'+today()+'.json'; a.click(); URL.revokeObjectURL(a.href);
}
function doImport(file){
  const r=new FileReader();
  r.onload=()=>{ try{
    const d=JSON.parse(r.result);
    if(d && d.clicks){ state.clicks=Object.assign({},state.clicks,d.clicks); }
    if(d && d.srs){ state.srs=Object.assign({},state.srs,d.srs); }
    save(); renderLearn(); updateOverall(); renderHome();
    alert('导入成功，进度已合并恢复。');
  }catch(e){ alert('导入失败：文件格式不正确。'); } };
  r.readAsText(file);
}
function doReset(){
  if(!confirm('确定清空全部学习次数、掌握状态与训练进度？此操作不可撤销。')) return;
  state={clicks:{},srs:{},version:1}; save();
  renderLearn(); updateOverall(); renderHome();
  if(document.getElementById('mode-progress').hidden===false) renderProgress();
}
document.getElementById('btnExport').onclick=doExport;
document.getElementById('btnExport2').onclick=doExport;
document.getElementById('btnImport').onclick=()=>document.getElementById('fileImport').click();
document.getElementById('btnImport2').onclick=()=>document.getElementById('fileImport').click();
document.getElementById('fileImport').onchange=e=>{ if(e.target.files[0]) doImport(e.target.files[0]); e.target.value=''; };
document.getElementById('btnReset').onclick=doReset;
document.getElementById('btnReset2').onclick=doReset;
document.getElementById('detailModal').addEventListener('click', e=>{ if(e.target.id==='detailModal') closeDetail(); });

/* ---------- 语义筛选选项 ---------- */
(function fillSem(){
  const set=new Set();
  ['prefix','root','suffix'].forEach(c=>APPDATA[c].forEach(it=>{ if(it.sem) set.add(it.sem); }));
  const sel=document.getElementById('fSem');
  [...set].sort().forEach(g=>{ const o=document.createElement('option'); o.value=g; o.textContent=g; sel.appendChild(o); });
})();

/* ---------- 初始化 ---------- */
renderHome();
updateOverall();
</script>
